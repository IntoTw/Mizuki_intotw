server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }
    error_page 404 /404.html;
}
