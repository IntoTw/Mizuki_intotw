services:
  blog:
    image: ${BLOG_IMAGE:?Set BLOG_IMAGE to a versioned image}
    platform: ${BLOG_PLATFORM:-linux/amd64}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BLOG_PORT:-8080}:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
